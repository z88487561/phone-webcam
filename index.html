<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10161c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>手機攝影機</title>
<style>
:root{--bg:#10161c;--c:#192129;--bd:#2a3541;--fg:#e6ebf0;--mut:#8a97a5;--ac:#5ad1c4;--red:#ff5a4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,"Noto Sans TC",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0;flex:1}h2{font-size:15px;margin:0 0 8px}
button,input,select{font:inherit;color:var(--fg);background:var(--c);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
button:focus-visible,input:focus-visible{outline:2px solid var(--ac)}
button.p{background:var(--ac);border-color:var(--ac);color:#06201d}
button.r{background:var(--red);border-color:var(--red);color:#fff}
main{padding:12px;max-width:820px;margin:auto}
.card{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
video{width:100%;background:#000;border-radius:12px;max-height:66vh;display:block;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);display:inline-block}
.dot.on{background:var(--ac)}.dot.m{background:var(--red)}
.hide{display:none!important}
dialog{background:var(--c);color:var(--fg);border:1px solid var(--bd);border-radius:12px;width:min(520px,94vw)}
dialog::backdrop{background:#000a}
.qr{max-width:240px;margin:8px auto;background:#fff;border-radius:8px;padding:4px}.qr svg{display:block;width:100%;height:auto}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000e;padding:8px 14px;border-radius:20px;z-index:9;max-width:90vw}
#dim{position:fixed;inset:0;background:#000;z-index:8;display:flex;align-items:center;justify-content:center;color:#2a2a2a}
.mut{color:var(--mut);font-size:13px;word-break:break-all}
.ev{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
label{display:block;margin:10px 0 3px}
input[type=text],input:not([type]){width:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:10px}
.tile{position:relative;background:#000;border-radius:12px;overflow:hidden;cursor:pointer;aspect-ratio:16/9;border:2px solid transparent}
.tile.f{grid-column:1/-1;aspect-ratio:auto;border-color:var(--ac);min-height:160px}
.tile video{width:100%;height:100%;object-fit:contain;max-height:none;margin:0;border-radius:0}
.tile.f video{height:auto;max-height:62vh}
.tile .ov{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;align-items:center;padding:6px 8px;background:linear-gradient(#000b,#0000);font-size:13px}
.tile .ov button{padding:2px 8px}
.tile .off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);background:#000}
input[type=range]{width:100%;padding:0}
</style>
</head>
<body>
<header><h1 id="ttl">手機攝影機</h1><button id="bSet" aria-label="設定">⚙️</button></header>
<main>
<section id="home" class="hide"><div class="card"><h2>這支手機要做什麼？</h2>
  <div class="row"><button class="p" id="mCam">📷 當攝影機</button><button id="mVwr">📺 當檢視器</button></div>
  <div class="mut">攝影機放在要看的地方；檢視器用另一支手機或電腦觀看。</div></div></section>

<section id="cam" class="hide">
  <video id="pv" autoplay muted playsinline></video>
  <div class="card"><span class="dot" id="md"></span> <b id="cs">待機</b> <span class="mut" id="cinfo"></span>
    <div id="pairs" style="margin-top:8px"></div>
    <div class="row"><button class="p" id="cGo">開始守候</button><button id="cScan">📷 掃描配對 QR</button><button id="cEv">錄影事件</button><button id="cDim">省電螢幕</button></div>
    <div class="row"><input id="addin" placeholder="或貼上檢視器的配對連結" style="flex:1"><button id="addb">加入</button></div></div>
</section>

<section id="vwr" class="hide">
  <div class="row"><b id="vcount" style="flex:1"></b><button id="vAdd">＋ 新增攝影機</button></div>
  <div class="card" id="pbox"><h2>新增攝影機</h2>
    <div class="mut">在要當攝影機的手機上，用相機 App 掃描這個 QR（或在攝影機頁按「掃描配對 QR」）。</div>
    <div id="pqr" class="qr"></div><input id="plk" readonly>
    <div class="row"><button id="pcp" class="p">複製連結</button></div></div>
  <div class="grid" id="grid"></div>
  <div class="card hide" id="ctl"><b id="ctlname"></b>
    <div class="row"><button id="bTalk">🎤 按住對講</button><button id="bSnap">📸 拍照</button><button id="bTorch" class="hide">🔦</button><button id="bSw">🔄 鏡頭</button><button id="bMute">🔊</button><button id="bFs">⛶</button><button id="bEv">🎞️ 錄影</button></div>
    <input type="range" id="zm" class="hide" aria-label="縮放"></div>
</section>
</main>

<dialog id="sd"><h2>設定</h2>
  <div id="sCamF">
    <label for="sName">攝影機名稱</label><input id="sName">
    <label><input type="checkbox" id="sMot"> 動態偵測</label>
    <label for="sSens">靈敏度</label><input type="range" id="sSens" min="1" max="100">
    <label><input type="checkbox" id="sRec"> 偵測到動態時錄影（保留最近 30 段）</label>
    <label for="sNtfy">ntfy 通知主題（選填，離線時推播到手機）</label><input id="sNtfy" placeholder="例：my-cam-8f3k">
  </div>
  <div id="sVwrF"><div class="row"><button id="sPin">重新產生配對碼（舊攝影機需重新配對）</button></div></div>
  <label><input type="checkbox" id="sWan"> 允許跨網路（使用 STUN；嚴格 NAT 需自備 TURN）</label>
  <div class="row"><button id="sRole">切換角色</button><button id="sClose" class="p">完成</button></div>
</dialog>
<dialog id="scd"><h2>掃描檢視器上的 QR</h2><video id="scv" autoplay muted playsinline></video><div class="row"><button id="scx">取消</button></div></dialog>
<dialog id="evd"><h2>錄影事件</h2><video id="evv" controls playsinline class="hide"></video>
  <a id="evdl" class="hide" style="color:var(--ac)">下載這段</a><div id="evl"></div>
  <div class="row"><button id="evc">關閉</button></div></dialog>
<div id="dim" class="hide">點一下喚醒</div>
<div id="toast" class="hide"></div>
<audio id="ta" hidden></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hide'),3200)};
const PC=()=>({config:{iceServers:LS.get('wan',false)?[{urls:'stun:stun.l.google.com:19302'}]:[]}});
const rid=n=>Math.random().toString(36).slice(2,2+n);
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const SC={home:'手機攝影機',cam:'📷 攝影機',vwr:'📺 檢視器'};
const show=s=>{for(const k in SC)$('#'+k).classList.toggle('hide',k!==s);$('#ttl').textContent=SC[s];};
const copy=t=>navigator.clipboard.writeText(t).then(()=>toast('已複製'));
function qr(el,u){try{const q=qrcode(0,'M');q.addData(u);q.make();el.innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){el.textContent='QR 產生失敗'}}

// ---- IndexedDB（錄影片段）----
const DB=new Promise(r=>{const q=indexedDB.open('pwcam',1);q.onupgradeneeded=()=>q.result.createObjectStore('clips',{keyPath:'id',autoIncrement:true});q.onsuccess=()=>r(q.result)});
const tx=async(m,f)=>{const d=await DB;return new Promise((res,rej)=>{const t=d.transaction('clips',m),q=f(t.objectStore('clips'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error)})};
const evList=async()=>(await tx('readonly',s=>s.getAll())).map(r=>({id:r.id,ts:r.ts,dur:r.dur,size:r.blob.size})).reverse();
function openEv(list,get,del){
  const L=$('#evl');L.innerHTML=list.length?'':'<div class="mut">目前沒有錄影</div>';
  list.forEach(e=>{const r=document.createElement('div');r.className='ev';
    r.innerHTML=`<span>${new Date(e.ts).toLocaleString()}<br><span class="mut">${e.dur} 秒・${(e.size/1048576).toFixed(1)} MB</span></span><span><button>▶</button> <button>🗑</button></span>`;
    const [b1,b2]=r.querySelectorAll('button');
    b1.onclick=async()=>{toast('讀取中…');const b=await get(e.id),v=$('#evv'),a=$('#evdl');v.src=URL.createObjectURL(b);v.classList.remove('hide');v.play().catch(()=>{});a.href=v.src;a.download='clip-'+e.ts+(b.type.includes('mp4')?'.mp4':'.webm');a.classList.remove('hide')};
    b2.onclick=async()=>{await del(e.id);r.remove()};
    L.append(r)});
  $('#evv').classList.add('hide');$('#evdl').classList.add('hide');$('#evd').showModal();
}
$('#evc').onclick=()=>{$('#evv').pause();$('#evd').close()};

// ---- 共用 ----
async function boost(c,q){try{const sn=c.peerConnection.getSenders().find(s=>s.track&&s.track.kind==='video'),p=sn.getParameters(),low=q==='low';if(!p.encodings||!p.encodings.length)p.encodings=[{}];
  p.encodings[0].maxBitrate=low?8e5:4e6;p.encodings[0].scaleResolutionDownBy=low?2:1;p.degradationPreference='maintain-resolution';await sn.setParameters(p)}catch(e){}}
const newPin=()=>String(Math.floor(Math.random()*1e6)).padStart(6,'0');
const parsePair=s=>{try{const p=new URLSearchParams(new URL(s.trim()).hash.slice(1)),id=p.get('v'),k=p.get('k');return id&&k?{id,pin:k,name:p.get('n')||'檢視器'}:null}catch(e){return null}};

// ================= 攝影機（掃檢視器 QR 配對）=================
let camId=LS.get('camid',null);
if(!camId){camId='pwc-'+rid(10);LS.set('camid',camId)}
let S={name:'攝影機 '+camId.slice(-3).toUpperCase(),motion:true,sens:60,rec:true,ntfy:'',face:'environment',...LS.get('cs',{})};
const saveS=()=>LS.set('cs',S);
let pairs=LS.get('pairs',[]);
let stream,cpeer,vc={},calls={},qs={},authed=new Set(),prev=null,lastM=0,lastN=0,rec=null,recT=0,bat={},running=false,loopT,infoT,linkT,wl;
const pv=$('#pv');
const lock=async()=>{try{wl=await navigator.wakeLock.request('screen')}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running)lock()});
function renderPairs(){
  const L=$('#pairs');L.innerHTML=pairs.length?'':'<div class="mut">尚未配對。到檢視器顯示配對 QR，用相機 App 掃描，或按「掃描配對 QR」。</div>';
  pairs.forEach(p=>{const e=vc[p.id],d=document.createElement('div');d.className='row';
    d.innerHTML=`<span class="dot${e&&e.ok?' on':''}"></span><span style="flex:1">${esc(p.name)} <span class="mut">${p.bad?'配對碼無效，請重新掃描':e&&e.ok?'已連線':running?'連線中…':'待機'}</span></span><button>移除</button>`;
    d.querySelector('button').onclick=()=>{e&&e.conn.close();delete vc[p.id];authed.delete(p.id);pairs=pairs.filter(x=>x.id!==p.id);LS.set('pairs',pairs);renderPairs()};L.append(d)});
}
const viewers=()=>{renderPairs();$('#cinfo').textContent=running?'・'+authed.size+' 個檢視器連線中':''};
function addPair(p){pairs=[...pairs.filter(x=>x.id!==p.id),p];LS.set('pairs',pairs);renderPairs();if(running)link()}

async function getCam(){
  const old=stream,v={video:{facingMode:{ideal:S.face},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}}};
  try{stream=await navigator.mediaDevices.getUserMedia({...v,audio:true})}catch(e){stream=await navigator.mediaDevices.getUserMedia(v)}
  pv.srcObject=stream;prev=null;
  if(rec)stopRec();
  for(const c of Object.values(calls))c.peerConnection.getSenders().forEach(s=>{if(!s.track)return;const n=stream.getTracks().find(t=>t.kind===s.track.kind);if(n)s.replaceTrack(n)});
  if(old)old.getTracks().forEach(t=>t.stop());
}
async function camStart(){
  if(running)return;
  try{await getCam()}catch(e){return toast('相機失敗：'+e.message+(isSecureContext?'':'（需 HTTPS）'))}
  running=true;$('#cGo').textContent='停止守候';$('#cGo').className='r';$('#cs').textContent='守候中';
  lock();startPeer();viewers();
  loopT=setInterval(tick,500);infoT=setInterval(()=>authed.forEach(sendInfo),30000);linkT=setInterval(link,4000);
  if(navigator.getBattery)navigator.getBattery().then(b=>{const u=()=>{bat={level:Math.round(b.level*100),chg:b.charging};authed.forEach(sendInfo)};b.onlevelchange=b.onchargingchange=u;u()});
}
function camStop(){
  running=false;clearInterval(loopT);clearInterval(infoT);clearInterval(linkT);stopRec();
  Object.values(calls).forEach(c=>c.close());calls={};Object.values(vc).forEach(e=>e.conn.close());vc={};authed.clear();
  stream&&stream.getTracks().forEach(t=>t.stop());stream=null;pv.srcObject=null;
  cpeer&&cpeer.destroy();cpeer=null;wl&&wl.release().catch(()=>{});
  $('#cGo').textContent='開始守候';$('#cGo').className='p';$('#cs').textContent='待機';$('#md').classList.remove('m');viewers();
}
function startPeer(){
  const p=cpeer=new Peer(camId,PC());
  p.on('open',link);
  p.on('call',c=>{if(!authed.has(c.peer))return c.close();c.answer();c.on('stream',s=>{const a=$('#ta');a.srcObject=s;a.play().catch(()=>{})})}); // 檢視器對講
  p.on('disconnected',()=>running&&p.reconnect());
  p.on('error',e=>{if(e.type==='unavailable-id')setTimeout(()=>{if(running&&cpeer===p){p.destroy();startPeer()}},4000);else if(e.type!=='peer-unavailable')toast('連線錯誤：'+e.type)});
}
const link=()=>pairs.forEach(connectPair);
function connectPair(p){
  if(!cpeer||!cpeer.open||p.bad)return;
  const o=vc[p.id];if(o&&(o.conn.open||Date.now()-o.t<8000))return;
  if(o)o.conn.close();
  const c=cpeer.connect(p.id,{reliable:true}),e=vc[p.id]={conn:c,t:Date.now(),ok:false};
  c.on('open',()=>c.send({t:'hello',pin:p.pin,name:S.name}));
  c.on('data',m=>onMsg(c,p,m));
  c.on('close',()=>{if(vc[p.id]!==e)return;authed.delete(p.id);calls[p.id]&&calls[p.id].close();delete calls[p.id];e.ok=false;e.t=0;viewers()});
}
function sendInfo(id){
  const e=vc[id],vt=stream&&stream.getVideoTracks()[0],cp=vt&&vt.getCapabilities?vt.getCapabilities():{};
  if(e&&e.conn.open&&authed.has(id))e.conn.send({t:'info',bat,torch:!!cp.torch,zoom:cp.zoom?{min:cp.zoom.min,max:cp.zoom.max,step:cp.zoom.step||0.1}:null});
}
async function onMsg(c,p,m){
  if(m.t==='ok'){authed.add(p.id);vc[p.id].ok=true;viewers();sendInfo(p.id);return}
  if(m.t==='bad'){p.bad=true;toast('配對碼無效，請重新掃描檢視器的 QR');viewers();return}
  if(!authed.has(p.id)||!stream)return;
  const vt=stream.getVideoTracks()[0];
  switch(m.t){
    case'view':{calls[p.id]&&calls[p.id].close();const k=cpeer.call(p.id,stream);calls[p.id]=k;k.on('close',()=>{if(calls[p.id]===k)delete calls[p.id]});setTimeout(()=>boost(k,qs[p.id]),1500);break}
    case'stopview':calls[p.id]&&calls[p.id].close();break;
    case'q':qs[p.id]=m.v;calls[p.id]&&boost(calls[p.id],m.v);break;
    case'torch':vt.applyConstraints({advanced:[{torch:!!m.v}]}).catch(()=>{});break;
    case'zoom':vt.applyConstraints({advanced:[{zoom:m.v}]}).catch(()=>{});break;
    case'switch':S.face=S.face==='user'?'environment':'user';saveS();await getCam();authed.forEach(sendInfo);break;
    case'events':c.send({t:'events',list:await evList()});break;
    case'getclip':{const r=await tx('readonly',s=>s.get(m.id));if(r)c.send({t:'clip',id:m.id,mime:r.mime,buf:await r.blob.arrayBuffer()});break}
    case'delclip':await tx('readwrite',s=>s.delete(m.id));break;
    case'unpair':pairs=pairs.filter(x=>x.id!==p.id);LS.set('pairs',pairs);c.close();delete vc[p.id];authed.delete(p.id);viewers();break;
  }
}
// 動態偵測 + 錄影
const mc=document.createElement('canvas');mc.width=64;mc.height=48;const mx=mc.getContext('2d',{willReadFrequently:true});
function tick(){
  const now=Date.now();
  if(rec&&(now-lastM>8000||now-recT>60000))stopRec();
  if(!S.motion||pv.readyState<2)return;
  mx.drawImage(pv,0,0,64,48);const d=mx.getImageData(0,0,64,48).data,g=new Uint8Array(3072);let n=0;
  for(let i=0;i<3072;i++){g[i]=d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11;if(prev&&Math.abs(g[i]-prev[i])>25)n++}
  const hit=prev&&n/3072>0.005+0.08*(1-S.sens/100);prev=g;
  $('#md').classList.toggle('m',!!hit||!!rec);
  if(!hit)return;
  lastM=now;if(S.rec&&!rec)startRec();
  if(now-lastN>30000){lastN=now;
    authed.forEach(id=>{const e=vc[id];e&&e.conn.open&&e.conn.send({t:'motion',ts:now})});
    if(S.ntfy)fetch('https://ntfy.sh/'+encodeURIComponent(S.ntfy),{method:'POST',body:S.name+' 偵測到動態',headers:{Title:'Camera motion'}}).catch(()=>{});}
}
function startRec(){
  const mime=['video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(t=>MediaRecorder.isTypeSupported(t))||'';
  let r;try{r=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:1.5e6})}catch(e){return}
  const ch=[],t0=recT=Date.now();rec=r;
  r.ondataavailable=e=>e.data.size&&ch.push(e.data);
  r.onstop=async()=>{await tx('readwrite',s=>s.add({ts:t0,dur:Math.round((Date.now()-t0)/1000),mime:r.mimeType,blob:new Blob(ch,{type:r.mimeType})}));
    const ks=await tx('readonly',s=>s.getAllKeys());for(const k of ks.slice(0,Math.max(0,ks.length-30)))await tx('readwrite',s=>s.delete(k))};
  r.start(1000);
}
function stopRec(){const r=rec;rec=null;r&&r.state!=='inactive'&&r.stop()}

// 掃描檢視器 QR
let scanT=null,scanS=null,scanX;
function stopScan(){clearInterval(scanT);clearTimeout(scanX);scanT=null;if(scanS){scanS.getTracks().forEach(t=>t.stop());scanS=null}$('#scd').open&&$('#scd').close()}
function scanLoop(v){
  clearInterval(scanT);clearTimeout(scanX);scanX=setTimeout(stopScan,30000);
  const c=document.createElement('canvas'),x=c.getContext('2d',{willReadFrequently:true});
  scanT=setInterval(()=>{if(!v.videoWidth)return;c.width=v.videoWidth;c.height=v.videoHeight;x.drawImage(v,0,0);
    const r=jsQR(x.getImageData(0,0,c.width,c.height).data,c.width,c.height),p=r&&parsePair(r.data);
    if(p){stopScan();addPair(p);toast('已配對：'+p.name);camStart()}},250);
}
$('#cScan').onclick=async()=>{
  if(running){toast('把鏡頭對準檢視器上的 QR…');return scanLoop(pv)}
  try{scanS=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}})}catch(e){return toast('相機失敗：'+e.message)}
  $('#scv').srcObject=scanS;$('#scd').showModal();scanLoop($('#scv'));
};
$('#scx').onclick=stopScan;
$('#addb').onclick=()=>{const p=parsePair($('#addin').value);if(!p)return toast('連結無效');$('#addin').value='';addPair(p);camStart()};
$('#cGo').onclick=()=>running?camStop():camStart();
$('#cEv').onclick=async()=>openEv(await evList(),id=>tx('readonly',s=>s.get(id)).then(r=>r.blob),id=>tx('readwrite',s=>s.delete(id)));
$('#cDim').onclick=()=>$('#dim').classList.remove('hide');$('#dim').onclick=()=>$('#dim').classList.add('hide');

// ================= 檢視器（多畫面）=================
let vid=LS.get('vid',null),vpin=LS.get('vpin',null),vpeer,C={},focus=null,tcall,mic,torchOn=false,pend={};
if(!vid){vid='pwv-'+rid(10);LS.set('vid',vid)}
if(!vpin){vpin=newPin();LS.set('vpin',vpin)}
const vUrl=()=>location.origin+location.pathname+'#v='+vid+'&k='+vpin+'&n='+encodeURIComponent('檢視器 '+vid.slice(-3).toUpperCase());
const saveKc=()=>LS.set('kc',Object.values(C).map(t=>({id:t.id,name:t.name})));
const T=()=>C[focus],sendF=m=>{const t=T();t&&t.conn&&t.conn.open&&t.conn.send(m)};
function showPbox(on){$('#pbox').classList.toggle('hide',!on);if(on){const u=vUrl();qr($('#pqr'),u);$('#plk').value=u}}
function upd(t){
  t.nm.textContent=t.name;t.dot.className='dot'+(t.ok?' on':'');t.off.classList.toggle('hide',t.ok);
  t.inf.textContent=t.ok&&t.info.bat&&t.info.bat.level!=null?'🔋'+t.info.bat.level+'%'+(t.info.bat.chg?'⚡':''):'';
  const all=Object.values(C);$('#vcount').textContent=all.length?`在線 ${all.filter(x=>x.ok).length} / ${all.length}`:'尚無攝影機';
}
function tile(id,name){
  let t=C[id];if(t){if(name)t.name=name;upd(t);return t}
  const el=document.createElement('div');el.className='tile';
  el.innerHTML='<video autoplay muted playsinline></video><div class="ov"><span class="dot"></span><b></b><span class="mut"></span><span style="flex:1"></span><button aria-label="移除">🗑</button></div><div class="off">離線</div>';
  t=C[id]={id,name:name||'攝影機',el,video:el.querySelector('video'),dot:el.querySelector('.dot'),nm:el.querySelector('b'),inf:el.querySelector('.mut'),off:el.querySelector('.off'),conn:null,ok:false,info:{}};
  el.onclick=e=>{if(e.target.tagName!=='BUTTON')setFocus(focus===id?null:id)};
  el.querySelector('button').onclick=()=>{if(confirm('移除「'+t.name+'」？')){t.conn&&t.conn.open&&t.conn.send({t:'unpair'});t.el.remove();delete C[id];saveKc();if(focus===id)setFocus(null);upd({nm:{},dot:{},off:{classList:{toggle(){}}},inf:{},ok:0,info:{},name:''});}};
  $('#grid').append(el);upd(t);return t;
}
function setFocus(id){
  const prev=focus;focus=id;
  if(prev&&prev!==id&&C[prev]&&C[prev].conn&&C[prev].conn.open)C[prev].conn.send({t:'q',v:'low'});
  Object.values(C).forEach(t=>{t.el.classList.toggle('f',t.id===id);t.video.muted=t.id!==id});
  $('#ctl').classList.toggle('hide',!id);torchOn=false;
  if(!id)return;
  if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
  const t=C[id];$('#ctlname').textContent='🎛 '+t.name;sendF({t:'q',v:'high'});ctlInfo(t);t.video.play().catch(()=>{});t.el.scrollIntoView({block:'nearest'});
}
function ctlInfo(t){
  if(t.id!==focus)return;const i=t.info||{};$('#bTorch').classList.toggle('hide',!i.torch);const z=$('#zm');z.classList.toggle('hide',!i.zoom);
  if(i.zoom){z.min=i.zoom.min;z.max=i.zoom.max;z.step=i.zoom.step}
}
function vmsg(t,m){
  switch(m.t){
    case'info':t.info=m;upd(t);ctlInfo(t);break;
    case'motion':toast('⚠️ '+t.name+' 偵測到動態');t.dot.classList.add('m');setTimeout(()=>upd(t),5000);
      if('Notification' in window&&Notification.permission==='granted')navigator.serviceWorker.ready.then(r=>r.showNotification('手機攝影機',{body:t.name+' 偵測到動態',tag:'motion-'+t.id})).catch(()=>{});break;
    case'events':pend.ev&&pend.ev(m.list);pend.ev=null;break;
    case'clip':pend['c'+m.id]&&pend['c'+m.id](new Blob([m.buf],{type:m.mime}));delete pend['c'+m.id];break;
  }
}
function vStart(){
  if(vpeer&&!vpeer.destroyed)return;
  const p=vpeer=new Peer(vid,PC());
  p.on('connection',c=>{
    c.on('data',m=>{
      if(m.t==='hello'){
        if(m.pin!==vpin){c.send({t:'bad'});return}
        const t=tile(c.peer,m.name);if(t.conn&&t.conn!==c)t.conn.close();
        t.conn=c;t.ok=true;t.name=m.name||t.name;saveKc();upd(t);showPbox(false);
        c.send({t:'ok'});c.send({t:'q',v:focus===c.peer?'high':'low'});c.send({t:'view'});
        if(focus===c.peer)$('#ctlname').textContent='🎛 '+t.name;return}
      const t=C[c.peer];if(t&&t.conn===c)vmsg(t,m);
    });
    c.on('close',()=>{const t=C[c.peer];if(t&&t.conn===c){t.ok=false;t.conn=null;t.video.srcObject=null;t.info={};upd(t)}});
  });
  p.on('call',c=>{const t=C[c.peer];if(!t||!t.ok)return c.close();c.answer();
    c.on('stream',s=>{t.video.srcObject=s;t.video.muted=focus!==t.id;t.video.play().catch(()=>{})})});
  p.on('disconnected',()=>p.reconnect());
  p.on('error',e=>{if(e.type==='unavailable-id')setTimeout(()=>{if(vpeer===p){p.destroy();vpeer=null;vStart()}},4000);else if(e.type!=='peer-unavailable')toast('連線錯誤：'+e.type)});
}
$('#vAdd').onclick=()=>showPbox($('#pbox').classList.contains('hide'));
$('#pcp').onclick=()=>copy($('#plk').value);
$('#bTorch').onclick=()=>{torchOn=!torchOn;sendF({t:'torch',v:torchOn})};
$('#bSw').onclick=()=>sendF({t:'switch'});
$('#zm').oninput=e=>sendF({t:'zoom',v:+e.target.value});
$('#bMute').onclick=()=>{const t=T();if(t){t.video.muted=!t.video.muted;$('#bMute').textContent=t.video.muted?'🔇':'🔊'}};
$('#bFs').onclick=()=>{const t=T();t&&t.video.requestFullscreen&&t.video.requestFullscreen()};
$('#bSnap').onclick=()=>{const v=T()&&T().video;if(!v||!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
  c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='snap-'+Date.now()+'.jpg';a.click()},'image/jpeg',.92)};
$('#bEv').onclick=async()=>{const t=T();if(!t||!t.ok)return toast('攝影機離線');
  const list=await new Promise(r=>{pend.ev=r;sendF({t:'events'})});
  openEv(list,id=>new Promise(r=>{pend['c'+id]=r;sendF({t:'getclip',id})}),id=>sendF({t:'delclip',id}))};
const tk=$('#bTalk');
tk.onpointerdown=async e=>{e.preventDefault();if(!focus)return;try{
  if(!mic)mic=await navigator.mediaDevices.getUserMedia({audio:true});
  if(tcall&&tcall.peer!==focus){tcall.close();tcall=null}
  if(!tcall){tcall=vpeer.call(focus,mic);tcall.on('close',()=>{tcall=null})}
  mic.getAudioTracks().forEach(t=>t.enabled=true);tk.classList.add('r')}catch(x){toast('麥克風失敗：'+x.message)}};
tk.onpointerup=tk.onpointercancel=tk.onpointerleave=()=>{mic&&mic.getAudioTracks().forEach(t=>t.enabled=false);tk.classList.remove('r')};

// ================= 設定與啟動 =================
$('#bSet').onclick=()=>{const m=LS.get('mode',null);$('#sCamF').classList.toggle('hide',m!=='cam');$('#sVwrF').classList.toggle('hide',m!=='vwr');
  $('#sName').value=S.name;$('#sMot').checked=S.motion;$('#sSens').value=S.sens;$('#sRec').checked=S.rec;$('#sNtfy').value=S.ntfy;$('#sWan').checked=LS.get('wan',false);$('#sd').showModal()};
$('#sd').oninput=()=>{S.name=$('#sName').value||S.name;S.motion=$('#sMot').checked;S.sens=+$('#sSens').value;S.rec=$('#sRec').checked;S.ntfy=$('#sNtfy').value.trim();saveS();if(!S.motion)prev=null};
$('#sWan').onchange=e=>{LS.set('wan',e.target.checked);location.reload()};
$('#sPin').onclick=()=>{vpin=newPin();LS.set('vpin',vpin);showPbox(true);toast('配對碼已更新，已配對的攝影機需重新掃描')};
$('#sRole').onclick=()=>{LS.set('mode',null);location.reload()};
$('#sClose').onclick=()=>$('#sd').close();
function enterCam(auto){LS.set('mode','cam');show('cam');viewers();if(auto||pairs.length)camStart()}
function enterVwr(){LS.set('mode','vwr');show('vwr');vStart();LS.get('kc',[]).forEach(k=>tile(k.id,k.name));Object.values(C).forEach(upd);showPbox(!Object.keys(C).length)}
$('#mCam').onclick=()=>enterCam(false);$('#mVwr').onclick=enterVwr;

const hp=new URLSearchParams(location.hash.slice(1));let fromLink=false;
if(hp.get('v')&&hp.get('k')){addPair({id:hp.get('v'),pin:hp.get('k'),name:hp.get('n')||'檢視器'});LS.set('mode','cam');history.replaceState(null,'',location.pathname);fromLink=true}
const m0=LS.get('mode',null);m0==='cam'?enterCam(fromLink):m0==='vwr'?enterVwr():show('home');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
