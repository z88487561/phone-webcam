<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#10161c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>手機攝影機</title>
<style>
:root{--bg:#10161c;--c:#192129;--bd:#2a3541;--fg:#e6ebf0;--mut:#8a97a5;--ac:#5ad1c4;--red:#ff5a4f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,"Noto Sans TC",sans-serif;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd)}
h1{font-size:17px;margin:0;flex:1}h2{font-size:15px;margin:0 0 8px}
button,input,select{font:inherit;color:var(--fg);background:var(--c);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac)}
button.p{background:var(--ac);border-color:var(--ac);color:#06201d}
button.r{background:var(--red);border-color:var(--red);color:#fff}
main{padding:12px;max-width:900px;margin:auto}
.card{background:var(--c);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
video{width:100%;background:#000;border-radius:12px;max-height:66vh;display:block;margin-bottom:10px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.dot{width:10px;height:10px;border-radius:50%;background:var(--mut);display:inline-block}
.dot.on{background:var(--ac)}.dot.m{background:var(--red)}
.hide{display:none!important}
dialog{background:var(--c);color:var(--fg);border:1px solid var(--bd);border-radius:12px;width:min(540px,94vw);max-height:92vh}
dialog::backdrop{background:#000a}
.qr{max-width:240px;margin:8px auto;background:#fff;border-radius:8px;padding:4px}.qr svg{display:block;width:100%;height:auto}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#000e;padding:8px 14px;border-radius:20px;z-index:99;max-width:90vw}
#dim{position:fixed;inset:0;background:#000;z-index:98;display:flex;align-items:center;justify-content:center;color:#2a2a2a}
.mut{color:var(--mut);font-size:13px;word-break:break-all}
.ev{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}
label{display:block;margin:10px 0 3px}
input[type=text],input:not([type]),select{width:100%}
input[type=range]{width:100%;padding:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;margin-bottom:10px}
.tile{position:relative;background:#000;border-radius:12px;overflow:hidden;cursor:pointer;aspect-ratio:16/9;border:2px solid transparent}
.tile.f{grid-column:1/-1;aspect-ratio:auto;border-color:var(--ac);min-height:160px}
.tile video{width:100%;height:100%;object-fit:contain;max-height:none;margin:0;border-radius:0}
.tile.f video{height:auto;max-height:62vh}
.tile .ov{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;align-items:center;padding:6px 8px;background:linear-gradient(#000b,#0000);font-size:13px;flex-wrap:wrap}
.tile .ov button{padding:2px 8px}
.tile .off{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--mut);background:#000;text-align:center;padding:8px}
.tile .st{position:absolute;left:6px;bottom:4px;font-size:11px;color:#fff;text-shadow:0 0 3px #000,0 0 3px #000}
.grid[data-n="2"]{grid-template-columns:repeat(2,1fr)}
.grid[data-n="4"]{grid-template-columns:repeat(2,1fr)}
.grid[data-n="9"]{grid-template-columns:repeat(3,1fr)}
@media(max-width:600px){.grid[data-n="2"]{grid-template-columns:1fr}.grid[data-n="9"]{grid-template-columns:repeat(2,1fr)}}
#grid:fullscreen{background:var(--bg);padding:8px;overflow:auto;align-content:center}
.tile .pz{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000c;text-align:center;padding:8px}
.tile .ov button{padding:2px 6px}
#mkw{position:relative;line-height:0}#mkc{width:100%;background:#000;border-radius:8px}
.mg{position:absolute;inset:0;display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(6,1fr)}
.mg i{border:1px solid #fff5;cursor:pointer}.mg i.x{background:#ff5a4f99}
#hstat{white-space:pre-wrap;font-size:13px;color:var(--mut)}
</style>
</head>
<body>
<header><h1 id="ttl">手機攝影機</h1><button id="bSet" aria-label="設定">⚙️</button></header>
<main>
<section id="home" class="hide"><div class="card"><h2>這支手機要做什麼？</h2>
  <div class="row"><button class="p" id="mCam">📷 當攝影機</button><button id="mVwr">📺 當檢視器</button></div>
  <div class="mut">攝影機放在要看的地方；檢視器用另一支手機或電腦觀看。</div></div></section>

<section id="cam" class="hide">
  <video id="pv" autoplay muted playsinline></video>
  <div class="card"><span class="dot" id="md"></span> <b id="cs">待機</b> <span class="mut" id="cinfo"></span>
    <div id="hstat"></div>
    <div id="pairs" style="margin-top:8px"></div>
    <div class="row"><button class="p" id="cGo">開始守候</button><button id="cScan">📷 掃描配對 QR</button><button id="cEv">錄影事件</button><button id="cDim">全黑待機</button></div>
    <div class="row"><input id="addin" placeholder="或貼上檢視器的配對連結" style="flex:1"><button id="addb">加入</button></div></div>
</section>

<section id="vwr" class="hide">
  <div class="row"><b id="vcount" style="flex:1"></b><button id="vAdd">＋ 新增攝影機</button></div>
  <div class="card" id="pbox"><h2>新增攝影機</h2>
    <div class="mut">用要當攝影機的手機相機 App 掃描（或在攝影機頁按「掃描配對 QR」）。配對碼 5 分鐘內有效、只能用一次。</div>
    <div id="pqr" class="qr"></div><div class="mut" id="pexp"></div><input id="plk" readonly>
    <div class="row"><button id="pcp" class="p">複製連結</button></div></div>
  <div class="row hide" id="gbar"></div>
  <div class="row"><select id="vSort" style="width:auto" aria-label="排序"><option value="manual">手動排序</option><option value="name">名稱</option><option value="online">在線優先</option><option value="recent">最近連線</option></select>
    <select id="vLay" style="width:auto" aria-label="分割"><option value="0">自動</option><option value="2">2 分割</option><option value="4">4 分割</option><option value="9">9 分割</option></select>
    <button id="vAll">▶ 全部觀看</button><button id="vNone">⏸ 全部暫停</button><button id="vFs">⛶ 全螢幕</button></div>
  <div class="grid" id="grid"></div>
  <div class="row hide" id="pager" style="justify-content:center"><button id="pgP">‹ 上一頁</button><span id="pgT"></span><button id="pgN">下一頁 ›</button></div>
  <div class="card hide" id="ctl"><b id="ctlname"></b>
    <div class="row"><button id="bTalk">🎤 按住對講</button><button id="bSnap">📸 拍照</button><button id="bTorch" class="hide">🔦 手電筒：關</button><button id="bSw">🔄 切換鏡頭</button><button id="bMute">🔊 聲音</button><button id="bFs">⛶ 全螢幕</button><button id="bEv">🎞️ 錄影</button><button id="bRst">♻️ 重啟攝影機</button></div>
    <input type="range" id="zm" class="hide" aria-label="縮放"></div>
</section>
</main>

<dialog id="sd"><h2>設定</h2>
  <div id="sCamF">
    <label for="sName">攝影機名稱</label><input id="sName">
    <label for="sLens">鏡頭</label><select id="sLens"></select>
    <label><input type="checkbox" id="sMic"> 啟用麥克風（串流與錄影收音）</label>
    <label><input type="checkbox" id="sMot"> 動態偵測</label>
    <label for="sSens">靈敏度</label><input type="range" id="sSens" min="1" max="100">
    <label for="sConf">連續確認次數（每次 0.5 秒，避免單張誤判）</label><select id="sConf"><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select>
    <label for="sTail">動態結束後再錄幾秒</label><select id="sTail"><option>5</option><option>10</option><option>20</option><option>30</option><option>60</option></select>
    <div class="row"><button id="sMask">🚫 設定忽略區域（窗戶、電視…）</button></div>
    <label><input type="checkbox" id="sRec"> 偵測到動態時錄影（含事件前約 3～6 秒）</label>
    <label for="sRq">錄影品質（碼率）</label><select id="sRq"><option value="720">720p 高</option><option value="480">480p 中</option><option value="low">低耗能</option></select>
    <label for="sMax">錄影容量上限（超過自動刪最舊）</label><select id="sMax"><option>100</option><option>250</option><option>500</option><option>1000</option><option>2000</option></select>
    <div class="mut" id="sStore"></div>
    <label for="sNtfy">ntfy 通知主題（選填）</label><input id="sNtfy" placeholder="例：my-cam-8f3k">
  </div>
  <div id="sVwrF">
    <label><input type="checkbox" id="sTalk"> 啟用對講（使用這台的麥克風）</label>
    <div class="row"><button id="sPin">立即重新產生配對碼</button></div>
  </div>
  <label><input type="checkbox" id="sWan"> 允許跨網路（使用 STUN；嚴格 NAT 需自備 TURN）</label>
  <div class="row"><button id="sRole">切換角色</button><button id="sClose" class="p">完成</button></div>
</dialog>
<dialog id="mkd"><h2>忽略區域</h2><div class="mut">點格子標記為忽略（紅色），這些區域的變化不會觸發動態。</div>
  <div id="mkw"><canvas id="mkc"></canvas><div class="mg" id="mkg"></div></div>
  <div class="row"><button id="mkclr">全部清除</button><button id="mkok" class="p">完成</button></div></dialog>
<dialog id="scd"><h2>掃描檢視器上的 QR</h2><video id="scv" autoplay muted playsinline></video><div class="row"><button id="scx">取消</button></div></dialog>
<dialog id="evd"><h2>錄影事件</h2><div class="mut" id="evstore"></div>
  <div class="row" id="evtools"><button id="evzip">⬇ 匯出全部 ZIP</button><button id="evclr" class="r">全部刪除</button></div>
  <video id="evv" controls playsinline class="hide"></video>
  <div class="row"><a id="evdl" class="hide" style="color:var(--ac)"></a></div><div id="evl"></div>
  <div class="row"><button id="evc">關閉</button></div></dialog>
<div id="dim" class="hide">點一下喚醒</div>
<div id="toast" class="hide"></div>
<audio id="ta" hidden></audio>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const LS={get:(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const toast=m=>{const t=$('#toast');t.textContent=m;t.classList.remove('hide');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.add('hide'),3500)};
const PC=()=>({config:{iceServers:LS.get('wan',false)?[{urls:'stun:stun.l.google.com:19302'}]:[]}});
const rnd=n=>{const a=new Uint32Array(1);crypto.getRandomValues(a);return a[0]%n};
const rid=n=>[...crypto.getRandomValues(new Uint8Array(n))].map(b=>(b%36).toString(36)).join('');
const rtok=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(b=>b.toString(16).padStart(2,'0')).join('');
const newPin=()=>String(rnd(1e6)).padStart(6,'0');
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const SC={home:'手機攝影機',cam:'📷 攝影機',vwr:'📺 檢視器'};
const show=s=>{for(const k in SC)$('#'+k).classList.toggle('hide',k!==s);$('#ttl').textContent=SC[s]};
const copy=t=>navigator.clipboard.writeText(t).then(()=>toast('已複製'));
const withTO=(p,ms=20000)=>Promise.race([p,new Promise((_,j)=>setTimeout(()=>j(new Error('逾時')),ms))]);
const mb=n=>(n/1048576).toFixed(1);
const saveBlob=(b,name)=>{const a=document.createElement('a'),u=URL.createObjectURL(b);a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),4000)};
function qr(el,u){try{const q=qrcode(0,'M');q.addData(u);q.make();el.innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true})}catch(e){el.textContent='QR 產生失敗'}}
const parsePair=s=>{try{const p=new URLSearchParams(new URL(s.trim()).hash.slice(1)),id=p.get('v'),k=p.get('k');return id&&k?{id,pin:k,name:p.get('n')||'檢視器'}:null}catch(e){return null}};
const TIER={high:[4e6,1],mid:[1.5e6,1.5],low:[6e5,2]},RANK={low:0,mid:1,high:2};
async function boost(c,q){try{const sn=c.peerConnection.getSenders().find(s=>s.track&&s.track.kind==='video'),p=sn.getParameters(),[br,sc]=TIER[q]||TIER.low;
  if(!p.encodings||!p.encodings.length)p.encodings=[{}];p.encodings[0].maxBitrate=br;p.encodings[0].scaleResolutionDownBy=sc;p.degradationPreference='maintain-resolution';await sn.setParameters(p)}catch(e){}}

// ---- IndexedDB（錄影；每段事件 = 多個可獨立播放的小檔 parts）----
const DB=new Promise(r=>{const q=indexedDB.open('pwcam',2);q.onupgradeneeded=()=>{const d=q.result;if(!d.objectStoreNames.contains('clips'))d.createObjectStore('clips',{keyPath:'id',autoIncrement:true})};q.onsuccess=()=>r(q.result)});
const tx=async(m,f)=>{const d=await DB;return new Promise((res,rej)=>{const t=d.transaction('clips',m),q=f(t.objectStore('clips'));t.oncomplete=()=>res(q&&q.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
const evList=async()=>(await tx('readonly',s=>s.getAll())).map(r=>({id:r.id,ts:r.ts,dur:r.dur,size:r.size})).reverse();
async function storeTxt(){const all=await tx('readonly',s=>s.getAll()),used=all.reduce((a,r)=>a+r.size,0);let q='';
  try{const e=await navigator.storage.estimate();q='・瀏覽器剩餘約 '+Math.round((e.quota-e.usage)/1048576)+' MB'}catch(e){}
  return `錄影 ${all.length} 段・已用 ${mb(used)} MB / 上限 ${S.maxMB} MB`+q}
async function prune(f){const all=await tx('readonly',s=>s.getAll()),cap=S.maxMB*1048576*f;let tot=all.reduce((a,r)=>a+r.size,0);
  for(const r of all){if(tot<=cap)break;await tx('readwrite',s=>s.delete(r.id));tot-=r.size}}
async function saveClip(c){
  const size=c.parts.reduce((a,b)=>a+b.size,0),r={ts:c.ts,dur:c.dur,mime:c.mime,parts:c.parts,size};
  try{await tx('readwrite',s=>s.add(r))}catch(e){await prune(.5);try{await tx('readwrite',s=>s.add(r))}catch(e2){return toast('儲存空間不足，這段錄影未儲存')}}
  await prune(1);
}
// 事件對話框
let evU=[];const revokeAll=()=>{evU.forEach(u=>URL.revokeObjectURL(u));evU=[]};
function playParts(c){revokeAll();const v=$('#evv'),us=c.parts.map(b=>{const u=URL.createObjectURL(new Blob([b],{type:c.mime}));evU.push(u);return u});let i=0;
  const go=()=>{v.src=us[i];v.play().catch(()=>{})};v.onended=()=>{if(++i<us.length)go()};v.classList.remove('hide');go()}
async function dlClip(c,e){const ext=c.mime.includes('mp4')?'mp4':'webm',n='clip-'+new Date(e.ts).toISOString().replace(/[:.]/g,'-');
  if(c.parts.length===1)return saveBlob(new Blob([c.parts[0]],{type:c.mime}),n+'.'+ext);
  const z=new JSZip();c.parts.forEach((p,i)=>z.file(`${n}-${i+1}.${ext}`,p));saveBlob(await z.generateAsync({type:'blob',compression:'STORE'}),n+'.zip')}
async function exportAll(){const all=await tx('readonly',s=>s.getAll());if(!all.length)return toast('沒有錄影');toast('壓縮中…');const z=new JSZip();
  all.forEach(r=>{const n='clip-'+new Date(r.ts).toISOString().replace(/[:.]/g,'-'),ext=r.mime.includes('mp4')?'mp4':'webm';r.parts.forEach((p,i)=>z.file(`${n}/${i+1}.${ext}`,p))});
  saveBlob(await z.generateAsync({type:'blob',compression:'STORE'}),'recordings.zip')}
async function openEv(list,get,del,local){
  const L=$('#evl');L.innerHTML=list.length?'':'<div class="mut">目前沒有錄影</div>';
  $('#evtools').classList.toggle('hide',!local);$('#evstore').textContent=local?await storeTxt():'';
  list.forEach(e=>{const r=document.createElement('div');r.className='ev';
    r.innerHTML=`<span>${new Date(e.ts).toLocaleString()}<br><span class="mut">約 ${e.dur} 秒・${mb(e.size)} MB</span></span><span><button>▶</button> <button>⬇</button> <button>🗑</button></span>`;
    const [b1,b2,b3]=r.querySelectorAll('button');
    const fetchC=async()=>{toast('讀取中…');try{return await get(e.id)}catch(x){toast('讀取失敗：'+x.message)}};
    b1.onclick=async()=>{const c=await fetchC();c&&playParts(c)};
    b2.onclick=async()=>{const c=await fetchC();c&&dlClip(c,e)};
    b3.onclick=async()=>{await del(e.id);r.remove();if(local)$('#evstore').textContent=await storeTxt()};
    L.append(r)});
  $('#evv').classList.add('hide');$('#evd').showModal();
}
$('#evc').onclick=()=>{$('#evv').pause();revokeAll();$('#evd').close()};
$('#evzip').onclick=exportAll;
$('#evclr').onclick=async()=>{if(!confirm('刪除全部錄影？'))return;await tx('readwrite',s=>s.clear());$('#evd').close();revokeAll();toast('已全部刪除')};

// ================= 攝影機 =================
let camId=LS.get('camid',null);
if(!camId){camId='pwc-'+rid(10);LS.set('camid',camId)}
let S={name:'攝影機 '+camId.slice(-3).toUpperCase(),motion:true,sens:60,conf:2,tail:10,rec:true,rq:'480',maxMB:500,ntfy:'',face:'environment',dev:'',mic:true,mask:Array(48).fill(0),...LS.get('cs',{})};
const saveS=()=>LS.set('cs',S);
let pairs=LS.get('pairs',[]);
const savePairs=()=>LS.set('pairs',pairs.map(({id,pin,tok,name})=>({id,pin,tok,name})));
const MIME=['video/webm;codecs=vp8,opus','video/webm','video/mp4'].find(t=>window.MediaRecorder&&MediaRecorder.isTypeSupported(t))||'';
const SEG=3,PRE=2,BR={720:2.5e6,480:1.2e6,low:5e5};
let stream,cpeer,vc={},calls={},qs={},authed=new Set(),prev=null,hits=0,lastM=0,lastN=0,bat={},running=false,loopT,infoT,linkT,hbT,wl,tOn=false,nDev=1;
let H={track:'live',fps:0,last:''},muteT,healT=0,pendHeal=null,lastTf=0,lastTt=0,stall=0;
let ring=[],clip=null,sr=null,segT;
const pv=$('#pv');
const lock=async()=>{try{wl=await navigator.wakeLock.request('screen')}catch(e){}};
const vdevs=async()=>(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==='videoinput');

function renderPairs(){
  const L=$('#pairs');L.innerHTML=pairs.length?'':'<div class="mut">尚未配對。到檢視器顯示配對 QR，用相機 App 掃描，或按「掃描配對 QR」。</div>';
  pairs.forEach(p=>{const e=vc[p.id],d=document.createElement('div');d.className='row';
    d.innerHTML=`<span class="dot${e&&e.ok?' on':''}"></span><span style="flex:1">${esc(p.name)} <span class="mut">${p.bad?'授權失效，請重新掃描':e&&e.ok?'已連線':running?'連線中…':'待機'}</span></span><button>移除</button>`;
    d.querySelector('button').onclick=()=>{e&&e.conn.close();delete vc[p.id];authed.delete(p.id);pairs=pairs.filter(x=>x.id!==p.id);savePairs();renderPairs()};L.append(d)});
}
const viewers=()=>{renderPairs();$('#cinfo').textContent=running?'・'+authed.size+' 個檢視器連線中':''};
function addPair(p){pairs=[...pairs.filter(x=>x.id!==p.id),p];savePairs();renderPairs();if(running)link()}

function tick(){

    if(S.mask[((i>>6)>>3)*8+((i&63)>>3)])continue;tot++;if(prev&&Math.abs(g[i]-prev[i])>25)n++}

    if(S.ntfy)fetch('https://ntfy.sh/'+encodeURIComponent(S.ntfy),{method:'POST',body:S.name+' 偵測到動態',headers:{Title:'Camera motion'}}).catch(()=>{});}

  bs[3].onclick=()=>{if(confirm('移除「'+t.name+'」並撤銷它的授權？')){t.conn&&t.conn.open&&t.conn.send({t:'unpair'});t.el.remove();delete C[id];saveKc();if(focus===id)setFocus(null);renderBar();layout();updCount()}};
  $('#grid').append(el);upd(t);return t;
}
function applyQ(t){const want=focus===t.id?'high':'low',eff=RANK[want]<=RANK[t.net]?want:t.net;if(eff!==t.q||t.qSent!==eff){t.q=eff;t.qSent=eff;t.conn&&t.conn.open&&t.conn.send({t:'q',v:eff})}}
function setFocus(id){
  focus=id;Object.values(C).forEach(t=>{t.el.classList.toggle('f',t.id===id);t.video.muted=t.id!==id;applyQ(t)});
  $('#ctl').classList.toggle('hide',!id);
  if(!id)return;
  if('Notification' in window&&Notification.permission==='default')Notification.requestPermission();
  const t=C[id];$('#ctlname').textContent='🎛 '+t.name;ctlInfo(t);t.video.play().catch(()=>{});t.el.scrollIntoView({block:'nearest'});
}
function ctlInfo(t){
  if(t.id!==focus)return;const i=t.info||{};$('#bTorch').classList.toggle('hide',!i.torch);$('#bTorch').textContent='🔦 手電筒：'+(i.torchOn?'開':'關');
  const z=$('#zm');z.classList.toggle('hide',!i.zoom);if(i.zoom){z.min=i.zoom.min;z.max=i.zoom.max;z.step=i.zoom.step}
  $('#bSw').textContent='🔄 切換鏡頭'+(i.lens?'（'+i.lens.slice(0,18)+'）':'');$('#bTalk').classList.toggle('hide',!V.talk);
}
async function vstats(t){
  const pc=t.call&&t.call.peerConnection;if(!pc||!t.ok||!t.viewing)return;
  const r=await pc.getStats(),o={};
  r.forEach(x=>{if(x.type==='inbound-rtp'&&x.kind==='video'){o.w=x.frameWidth;o.h=x.frameHeight;o.fps=x.framesPerSecond;o.b=x.bytesReceived;o.lost=x.packetsLost;o.rcv=x.packetsReceived;o.j=x.jitter}
    if(x.type==='candidate-pair'&&x.nominated&&x.currentRoundTripTime!=null)o.rtt=x.currentRoundTripTime*1000});
  const now=performance.now(),p=t.pst;t.pst={b:o.b,l:o.lost,r:o.rcv,t:now};if(!p)return;
  o.kbps=Math.round((o.b-p.b)*8/(now-p.t));const dl=o.lost-p.l,dr=o.rcv-p.r;o.loss=dl+dr>0?dl/(dl+dr)*100:0;
  t.st.textContent=`${o.w||'?'}x${o.h||'?'} ${Math.round(o.fps||0)}fps ${o.kbps}kbps RTT${Math.round(o.rtt||0)}ms 掉包${o.loss.toFixed(1)}% 抖動${Math.round((o.j||0)*1000)}ms ${pc.connectionState} 畫質${TIERNAME[t.q]}`;
  const want=o.loss>5||o.rtt>300?'low':o.loss>1.5||o.rtt>150?'mid':'high';
  if(RANK[want]<RANK[t.net]){t.net=want;t.good=0}else if(RANK[want]>RANK[t.net]&&++t.good>=3){t.net=want;t.good=0}else if(want===t.net)t.good=0;
  applyQ(t);
}
setInterval(()=>Object.values(C).forEach(t=>vstats(t).catch(()=>{})),2000);
function vmsg(t,m){
  t.last=Date.now();
  switch(m.t){
    case'info':t.info=m;if(m.name)t.name=m.name;upd(t);ctlInfo(t);break;
    case'hb':t.hb={...m,at:Date.now()};t.stale=false;upd(t);break;
    case'note':toast(t.name+'：'+m.m);break;
    case'motion':toast('⚠️ '+t.name+' 偵測到動態');t.dot.classList.add('m');setTimeout(()=>upd(t),5000);
      if('Notification' in window&&Notification.permission==='granted')navigator.serviceWorker.ready.then(r=>r.showNotification('手機攝影機',{body:t.name+' 偵測到動態',tag:'motion-'+t.id})).catch(()=>{});break;
    case'events':pend.ev&&pend.ev(m.list);pend.ev=null;break;
    case'clip':pend['c'+m.id]&&pend['c'+m.id]({mime:m.mime,parts:m.parts.map(b=>new Blob([b],{type:m.mime}))});delete pend['c'+m.id];break;
  }
}
function vauth(c,m){ // 回傳：null 拒絕、{lock}、{} 已授權、{tok} 新配對
  const k=(LS.get('kc',[])).find(x=>x.id===c.peer);
  if(m.tok)return k&&k.tok&&k.tok===m.tok?{}:null;
  if(Date.now()<lockUntil)return{lock:1};
  if(m.pin&&m.pin===vpin&&Date.now()-vpinT<3e5){fails=0;return{tok:rtok()}}
  if(++fails>=5){lockUntil=Date.now()+60000;fails=0;return{lock:1}}
  return null;
}
function vStart(){
  if(vpeer&&!vpeer.destroyed)return;
  const p=vpeer=new Peer(vid,PC());
  p.on('connection',c=>{
    c.on('data',m=>{
      if(m.t==='hello'){
        const r=vauth(c,m);if(!r||r.lock){c.send({t:'bad',lock:!!(r&&r.lock)});return}
        const t=tile(c.peer,m.name);if(t.conn&&t.conn!==c)t.conn.close();
        t.conn=c;t.ok=true;t.name=m.name||t.name;t.last=Date.now();t.pst=null;t.hb=null;
        if(r.tok){t.tok=r.tok;toast('✅ 已配對：'+t.name);regenPin(true);showPbox(false)}
        saveKc();upd(t);t.qSent=null;t.viewing=false;c.send(r.tok?{t:'ok',tok:r.tok}:{t:'ok'});applyQ(t);renderBar();layout();return}
      const t=C[c.peer];if(t&&t.conn===c)vmsg(t,m);
    });
    c.on('close',()=>{const t=C[c.peer];if(t&&t.conn===c){t.ok=false;t.conn=null;t.video.srcObject=null;t.info={};t.hb=null;t.viewing=false;t.st.textContent='';saveKc();upd(t);layout()}});
  });
  p.on('call',c=>{const t=C[c.peer];if(!t||!t.ok)return c.close();c.answer();t.call=c;
    c.on('stream',s=>{t.video.srcObject=s;t.video.muted=focus!==t.id;t.video.play().catch(()=>{})})});
  p.on('disconnected',()=>p.reconnect());
  p.on('error',e=>{if(e.type==='unavailable-id')setTimeout(()=>{if(vpeer===p){p.destroy();vpeer=null;vStart()}},4000);else if(e.type!=='peer-unavailable')toast('連線錯誤：'+e.type)});
}
$('#vAdd').onclick=()=>showPbox($('#pbox').classList.contains('hide'));
$('#pcp').onclick=()=>copy($('#plk').value);
$('#bTorch').onclick=()=>{const t=T();if(!t)return;const on=!t.info.torchOn;t.info.torchOn=on;ctlInfo(t);sendF({t:'torch',v:on})};
$('#bSw').onclick=()=>sendF({t:'switch'});
$('#bRst').onclick=()=>{sendF({t:'restart'});toast('已要求攝影機重啟')};
$('#zm').oninput=e=>sendF({t:'zoom',v:+e.target.value});
$('#bMute').onclick=()=>{const t=T();if(t){t.video.muted=!t.video.muted;$('#bMute').textContent=(t.video.muted?'🔇':'🔊')+' 聲音'}};
$('#bFs').onclick=()=>{const t=T();t&&t.video.requestFullscreen&&t.video.requestFullscreen()};
$('#bSnap').onclick=()=>{const v=T()&&T().video;if(!v||!v.videoWidth)return;const c=document.createElement('canvas');c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);
  c.toBlob(b=>saveBlob(b,'snap-'+Date.now()+'.jpg'),'image/jpeg',.92)};
$('#bEv').onclick=async()=>{const t=T();if(!t||!t.ok)return toast('攝影機離線');
  let list;try{list=await withTO(new Promise(r=>{pend.ev=r;sendF({t:'events'})}),8000)}catch(e){return toast('讀取事件失敗：'+e.message)}
  openEv(list,id=>withTO(new Promise(r=>{pend['c'+id]=r;sendF({t:'getclip',id})}),45000),id=>sendF({t:'delclip',id}),false)};
const tk=$('#bTalk');
tk.onpointerdown=async e=>{e.preventDefault();if(!focus||!V.talk)return;holding=true;tk.setPointerCapture&&tk.setPointerCapture(e.pointerId);tk.classList.add('r');
  try{if(!mic)mic=await navigator.mediaDevices.getUserMedia({audio:true});
    if(tcall&&tcall.peer!==focus){tcall.close();tcall=null}
    if(!tcall){tcall=vpeer.call(focus,mic);tcall.on('close',()=>{tcall=null})}
    mic.getAudioTracks().forEach(t=>t.enabled=holding)}  // 權限視窗期間若已放開，保持關閉
  catch(x){holding=false;tk.classList.remove('r');toast('麥克風失敗：'+x.message)}};
const talkUp=()=>{holding=false;mic&&mic.getAudioTracks().forEach(t=>t.enabled=false);tk.classList.remove('r')};
tk.onpointerup=tk.onpointercancel=tk.onlostpointercapture=talkUp;

// ================= 設定與啟動 =================
async function fillLens(){const ds=await vdevs().catch(()=>[]),s=$('#sLens');
  s.innerHTML='<option value="">自動（'+(S.face==='user'?'前':'後')+'鏡頭）</option>'+ds.map((d,i)=>`<option value="${esc(d.deviceId)}">${esc(d.label||'鏡頭 '+(i+1))}</option>`).join('');s.value=S.dev||''}
$('#bSet').onclick=async()=>{const m=LS.get('mode',null);$('#sCamF').classList.toggle('hide',m!=='cam');$('#sVwrF').classList.toggle('hide',m!=='vwr');
  $('#sName').value=S.name;$('#sMic').checked=S.mic;$('#sMot').checked=S.motion;$('#sSens').value=S.sens;$('#sConf').value=S.conf;$('#sTail').value=S.tail;$('#sRec').checked=S.rec;$('#sRq').value=S.rq;$('#sMax').value=S.maxMB;$('#sNtfy').value=S.ntfy;
  $('#sTalk').checked=V.talk;$('#sWan').checked=LS.get('wan',false);$('#sd').showModal();
  if(m==='cam'){fillLens();$('#sStore').textContent=await storeTxt()}};
$('#sd').oninput=e=>{if(e.target.id==='sLens'||e.target.id==='sTalk')return;
  S.name=$('#sName').value||S.name;S.motion=$('#sMot').checked;S.sens=+$('#sSens').value;S.conf=+$('#sConf').value;S.tail=+$('#sTail').value;S.rec=$('#sRec').checked;S.rq=$('#sRq').value;S.maxMB=+$('#sMax').value;S.ntfy=$('#sNtfy').value.trim();saveS();
  if(!S.motion)prev=null;if(S.rec&&running)segLoop();if(!S.rec){ring=[];stopSeg()}};
$('#sMic').onchange=e=>{S.mic=e.target.checked;saveS();if(running)getCam().then(()=>authed.forEach(sendInfo)).catch(x=>toast('相機失敗：'+x.message))};
$('#sLens').onchange=e=>{S.dev=e.target.value;saveS();if(running)getCam().then(()=>authed.forEach(sendInfo)).catch(x=>toast('切換失敗：'+x.message))};
$('#sTalk').onchange=e=>{V.talk=e.target.checked;LS.set('vtalk',V.talk);if(!V.talk){talkUp();mic&&mic.getTracks().forEach(t=>t.stop());mic=null;tcall&&tcall.close()}T()&&ctlInfo(T())};
$('#sWan').onchange=e=>{LS.set('wan',e.target.checked);location.reload()};
$('#sPin').onclick=()=>{regenPin(true);showPbox(true);toast('已產生新配對碼（已配對的攝影機不受影響）')};
$('#sRole').onclick=()=>{LS.set('mode',null);location.reload()};
$('#sClose').onclick=()=>$('#sd').close();
$('#sMask').onclick=()=>{const c=$('#mkc'),x=c.getContext('2d');c.width=320;c.height=240;x.fillStyle='#000';x.fillRect(0,0,320,240);if(pv.videoWidth)x.drawImage(pv,0,0,320,240);
  const g=$('#mkg');g.innerHTML='';S.mask.forEach((v,i)=>{const e=document.createElement('i');e.className=v?'x':'';e.onclick=()=>{S.mask[i]=S.mask[i]?0:1;e.className=S.mask[i]?'x':'';saveS();prev=null};g.append(e)});$('#mkd').showModal()};
$('#mkclr').onclick=()=>{S.mask.fill(0);saveS();prev=null;document.querySelectorAll('#mkg i').forEach(e=>e.className='')};
$('#mkok').onclick=()=>$('#mkd').close();
function enterCam(auto){LS.set('mode','cam');show('cam');viewers();if(auto||pairs.length)camStart()}
function enterVwr(){LS.set('mode','vwr');show('vwr');vStart();LS.get('kc',[]).forEach(k=>tile(k.id,k.name,{tok:k.tok,last:k.last,group:k.group}));Object.values(C).forEach(upd);updCount();renderBar();layout();showPbox(!Object.keys(C).length)}
$('#mCam').onclick=()=>enterCam(false);$('#mVwr').onclick=enterVwr;

const hp=new URLSearchParams(location.hash.slice(1));let fromLink=false;
if(hp.get('v')&&hp.get('k')){addPair({id:hp.get('v'),pin:hp.get('k'),name:hp.get('n')||'檢視器'});LS.set('mode','cam');history.replaceState(null,'',location.pathname);fromLink=true}
const m0=LS.get('mode',null);m0==='cam'?enterCam(fromLink):m0==='vwr'?enterVwr():show('home');
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').then(r=>{r.onupdatefound=()=>{const w=r.installing;w&&(w.onstatechange=()=>{if(w.state==='installed'&&navigator.serviceWorker.controller&&confirm('有新版本，立即更新？'))location.reload()})}}).catch(()=>{});
