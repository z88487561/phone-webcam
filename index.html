<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>手機變網路攝影機（掃碼即連）</title>
<style>
:root{--bg:#f6f7f9;--fg:#1a1d21;--card:#fff;--bd:#d9dde3;--ac:#1976d2;--mut:#6b7280}
@media(prefers-color-scheme:dark){:root{--bg:#111418;--fg:#e8eaed;--card:#1b2026;--bd:#2f3640;--ac:#64b5f6;--mut:#9aa3ad}}
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);padding:12px;max-width:760px;margin:auto}
h1{font-size:18px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
video{width:100%;background:#000;border-radius:8px;max-height:70vh}
button,select{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
.qr{max-width:300px;margin:8px auto;background:#fff;border-radius:8px;padding:4px}
.qr svg{display:block;width:100%;height:auto}
.mut{color:var(--mut);font-size:13px;word-break:break-all}
#st{font:13px monospace;white-space:pre-wrap}
.hide{display:none}
</style>
</head>
<body>
<h1 id="ttl">📷 手機變網路攝影機</h1>

<!-- 電腦（觀看端） -->
<section id="V" class="hide">
  <div class="card" id="pair">
    <div>用手機<b>相機 App 掃描</b>這個 QR，打開連結即自動連線：</div>
    <div id="qr" class="qr"></div>
    <div id="lnk" class="mut"></div>
  </div>
  <div class="card"><video id="rv" autoplay muted playsinline controls></video></div>
</section>

<!-- 手機（發送端） -->
<section id="S" class="hide">
  <div class="card"><video id="sv" autoplay muted playsinline></video>
    <p><select id="face"><option value="environment">後鏡頭</option><option value="user">前鏡頭</option></select></p>
  </div>
</section>

<div class="card"><div id="st">狀態：初始化</div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/peerjs/1.5.4/peerjs.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const log=m=>{$('#st').textContent='狀態：'+m};
const CFG={config:{iceServers:[]}}; // 只用區網 host candidate；要跨網路再加 STUN/TURN
const target=location.hash.slice(1);
let stream,call,peer,wl;

function watch(pc){
  setInterval(async()=>{
    if(!pc)return;
    const s=await pc.getStats();let t='連線：'+pc.connectionState;
    s.forEach(r=>{
      if(r.type==='inbound-rtp'&&r.kind==='video')t+=`\n接收 ${r.frameWidth||'?'}x${r.frameHeight||'?'} @ ${Math.round(r.framesPerSecond||0)}fps`;
      if(r.type==='outbound-rtp'&&r.kind==='video')t+=`\n傳送 ${r.frameWidth||'?'}x${r.frameHeight||'?'} @ ${Math.round(r.framesPerSecond||0)}fps`;
      if(r.type==='candidate-pair'&&r.nominated&&r.currentRoundTripTime!=null)t+=`\nRTT ${Math.round(r.currentRoundTripTime*1000)}ms`;
    });
    log(t);
  },1000);
}

// ===== 電腦端 =====
function viewer(){
  $('#V').classList.remove('hide');
  let id;try{id=localStorage.getItem('pwcam-id');}catch(e){}
  if(!id){id='pwcam-'+Math.random().toString(36).slice(2,12);try{localStorage.setItem('pwcam-id',id);}catch(e){}}
  peer=new Peer(id,CFG);
  peer.on('open',()=>{
    const url=location.origin+location.pathname+'#'+id;
    try{const q=qrcode(0,'M');q.addData(url);q.make();$('#qr').innerHTML=q.createSvgTag({cellSize:4,margin:2,scalable:true});}catch(e){}
    $('#lnk').textContent=url;log('等待手機連線…（此連結固定，可在手機加入書籤）');
  });
  peer.on('call',c=>{
    if(call)call.close();
    call=c;c.answer();
    c.on('stream',s=>{const v=$('#rv');v.srcObject=s;v.play().catch(()=>{});$('#pair').classList.add('hide');watch(c.peerConnection);});
    c.on('close',()=>{log('手機已斷線，等待重新連線…');$('#pair').classList.remove('hide');});
  });
  peer.on('disconnected',()=>peer.reconnect());
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){try{localStorage.removeItem('pwcam-id');}catch(x){}log('ID 被占用（可能開了兩個分頁），請重新整理');}
    else log('錯誤：'+e.type);
  });
}

// ===== 手機端 =====
async function getCam(){
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:$('#face').value},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}},audio:false});
  $('#sv').srcObject=stream;
  return stream;
}
async function boost(c){
  try{
    const sn=c.peerConnection.getSenders().find(s=>s.track&&s.track.kind==='video');
    const p=sn.getParameters();if(!p.encodings||!p.encodings.length)p.encodings=[{}];
    p.encodings[0].maxBitrate=4e6;p.degradationPreference='maintain-resolution';
    await sn.setParameters(p);
  }catch(e){}
}
function connect(){
  if(call&&call.open)return;
  log('連線電腦中…');
  call=peer.call(target,stream);
  call.on('stream',()=>{});
  call.on('close',()=>{log('連線中斷，重試中…');});
  const t=setInterval(()=>{ if(call.peerConnection){clearInterval(t);boost(call);watch(call.peerConnection);} },500);
  setTimeout(()=>clearInterval(t),15000);
}
async function sender(){
  $('#S').classList.remove('hide');$('#ttl').textContent='📱 發送中';
  try{await getCam();}catch(e){return log('相機失敗：'+e.message+(isSecureContext?'':'（需 HTTPS）'));}
  const lock=async()=>{try{wl=await navigator.wakeLock.request('screen');}catch(e){}};
  lock();document.addEventListener('visibilitychange',()=>{if(!document.hidden)lock();});
  peer=new Peer(CFG);
  peer.on('open',connect);
  peer.on('disconnected',()=>peer.reconnect());
  peer.on('error',e=>{log('錯誤：'+e.type+'，3 秒後重試');if(e.type==='peer-unavailable')setTimeout(connect,3000);});
  setInterval(()=>{if(peer.open&&!(call&&call.open))connect();},4000); // 自動重連
  $('#face').onchange=async()=>{
    await getCam();
    const sn=call&&call.peerConnection&&call.peerConnection.getSenders().find(s=>s.track&&s.track.kind==='video');
    if(sn)sn.replaceTrack(stream.getVideoTracks()[0]);
  };
}

target?sender():viewer();
</script>
</body>
</html>
